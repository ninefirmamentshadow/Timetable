name: build

# Debug is the fresh-clone floor; the signed release APK is the operational
# artifact and is never replaced by a debug build. Release signing runs only
# once the four keystore secrets are set (Settings > Secrets and variables >
# Actions); without them the job still passes and only the debug APK is built.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the screenshot-recording job may push.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (a moved tag cannot change what runs);
# the comment names the release each SHA is. gradle/actions stays on v5, the
# last release that is MIT-only (v6 adds a proprietary caching component).

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung Gradle daemon otherwise holds a runner for the six-hour default.
    timeout-minutes: 45

    # The secrets context is not available in step conditions, so only whether a
    # keystore is set is computed here; the keystore itself reaches one step.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # One entry point shared with local and agent runs: unit tests (including the
      # scheduling core and the Robolectric screenshot harness), lint against the
      # committed baseline, the debug build, the third-party inventory check and
      # git diff --check. It exits non-zero for FAIL and for NOT_RUN.
      - name: Verify
        run: scripts/verify.sh

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timetable-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Without signing secrets, still prove the minified (R8) release variant builds:
      # release-only shrinking problems surface here, not on the phone. The unsigned
      # APK is never uploaded; it is not installable and is never a release.
      - name: Release build check (unsigned, not uploaded)
        if: ${{ env.HAS_RELEASE_SIGNING != 'true' }}
        run: ./gradlew --no-daemon --console=plain assembleRelease

      # Outside the workspace, so no later step can upload or commit it by accident.
      - name: Decode keystore
        id: keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timetable-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # Screenshot goldens are recorded here, from the committed fixtures, never on a
  # workstation: goldens recorded elsewhere went stale (on 2026-10-22 they showed
  # amounts the committed fixtures never used, and 12 compares failed). A push whose head commit message contains [record-screenshots]
  # re-records them and commits the images back to the same branch; review the
  # images in that commit before merging. The build job above still compares.
  record-screenshots:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[record-screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Keeps the checkout token: this job pushes the re-recorded goldens.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Record goldens
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest \
            -Proborazzi.test.record=true --tests '*ScreenshotTest*'

      - name: Commit re-recorded goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --cached --quiet; then echo "goldens unchanged"; exit 0; fi
          git commit -m "Re-record screenshot goldens in CI (JDK 17)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
